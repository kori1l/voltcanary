name: voltcanary

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-voltcanary}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
  POSTGRES_DB: ${POSTGRES_DB:-voltcanary}
  POSTGRES_ADDITIONAL_DATABASES: ${POSTGRES_ADDITIONAL_DATABASES:-voltcanary_identity voltcanary_device voltcanary_analytics voltcanary_alerts voltcanary_simulator voltcanary_ai_agent}

x-timescale-env: &timescale-env
  POSTGRES_USER: ${TIMESCALE_USER:-voltcanary}
  POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-change_me}
  POSTGRES_DB: ${TIMESCALE_DB:-voltcanary_telemetry}

x-java-app: &java-app
  image: maven:3.9-eclipse-temurin-21
  profiles:
    - app
  working_dir: /workspace/backend
  volumes:
    - ./backend:/workspace/backend
    - maven-cache:/root/.m2
  environment:
    SPRING_PROFILES_ACTIVE: local
    SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-voltcanary}
    POSTGRES_USER: ${POSTGRES_USER:-voltcanary}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    JWT_SECRET: ${JWT_SECRET:-change_me}
    JWT_KEY_ID: ${JWT_KEY_ID:-dev-rsa}
    JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
    JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS:-}
    TIMESCALE_HOST: timescaledb
    TIMESCALE_PORT: 5432
    TIMESCALE_DB: ${TIMESCALE_DB:-voltcanary_telemetry}
    TIMESCALE_USER: ${TIMESCALE_USER:-voltcanary}
    TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-change_me}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    INGESTION_IDEMPOTENCY_REDIS_ENABLED: "true"
    INGESTION_RATE_LIMIT_REDIS_ENABLED: "true"
    TELEMETRY_RATE_LIMIT_REDIS_ENABLED: "true"
    GATEWAY_RATE_LIMIT_REDIS_ENABLED: "true"
    GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-voltcanary}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change_me_change_me}
    IDENTITY_SERVICE_URI: http://identity-service:8081
    DEVICE_SERVICE_URI: http://device-service:8082
    INGESTION_SERVICE_URI: http://ingestion-service:8083
    TELEMETRY_SERVICE_URI: http://telemetry-service:8084
    ANALYTICS_SERVICE_URI: http://analytics-service:8085
    ALERT_SERVICE_URI: http://alert-service:8086
    SIMULATOR_SERVICE_URI: http://simulator-service:8087
    AI_AGENT_SERVICE_URI: http://ai-agent-service:8088
    ML_SERVICE_URI: http://ml-service:8090
    INGESTION_MQTT_ENABLED: ${INGESTION_MQTT_ENABLED:-false}
    INGESTION_MQTT_BROKER_URL: tcp://mosquitto:1883
  depends_on:
    postgres-database-init:
      condition: service_completed_successfully
    timescaledb:
      condition: service_healthy
    redis:
      condition: service_healthy
    redpanda:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    profiles:
      - infra
      - app
    environment: *postgres-env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/docker-compose/init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-database-init:
    image: postgres:16-alpine
    profiles:
      - infra
      - app
    environment:
      <<: *postgres-env
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_me}
    command: /docker-entrypoint-initdb.d/001-create-databases.sh
    volumes:
      - ./deploy/docker-compose/init/postgres:/docker-entrypoint-initdb.d:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    profiles:
      - infra
      - app
    environment: *timescale-env
    ports:
      - "${TIMESCALE_PORT:-5433}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./deploy/docker-compose/init/timescaledb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    profiles:
      - infra
      - app
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    profiles:
      - infra
      - app
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,OUTSIDE://localhost:${REDPANDA_PORT:-9092}
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - redpanda:8082
    ports:
      - "${REDPANDA_PORT:-9092}:19092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:9092 | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  redpanda-init:
    image: redpandadata/redpanda:v24.2.18
    profiles:
      - infra
      - app
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./deploy/docker-compose/init/redpanda:/init:ro
    entrypoint: ["/bin/sh", "/init/create-topics.sh"]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles:
      - infra
      - app
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voltcanary}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_change_me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles:
      - infra
      - app
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voltcanary}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_change_me}
    volumes:
      - ./deploy/docker-compose/init/minio:/init:ro
    entrypoint: ["/bin/sh", "/init/create-buckets.sh"]
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    profiles:
      - infra
      - app
    ports:
      - "${MQTT_PORT:-1883}:1883"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && exec mosquitto -c /mosquitto/config/mosquitto.conf"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 >/dev/null 2>&1 || true"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/docker-compose/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  loki:
    image: grafana/loki:3.3.2
    profiles:
      - observability
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./deploy/docker-compose/observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  promtail:
    image: grafana/promtail:3.3.2
    profiles:
      - observability
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./deploy/docker-compose/observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/docker-compose/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    <<: *java-app
    command: sh -c "mvn -pl services/api-gateway -am -Dmaven.test.skip=true install && mvn -f services/api-gateway/pom.xml spring-boot:run"
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"

  identity-service:
    <<: *java-app
    command: sh -c "mvn -pl services/identity-service -am -Dmaven.test.skip=true install && mvn -f services/identity-service/pom.xml spring-boot:run"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      IDENTITY_POSTGRES_DB: ${IDENTITY_POSTGRES_DB:-voltcanary_identity}
      POSTGRES_USER: ${POSTGRES_USER:-voltcanary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_KEY_ID: ${JWT_KEY_ID:-dev-rsa}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS:-}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      JWT_REFRESH_TOKEN_TTL_SECONDS: ${JWT_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-voltcanary_telemetry}
      TIMESCALE_USER: ${TIMESCALE_USER:-voltcanary}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-voltcanary}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change_me_change_me}
      DEVICE_SERVICE_URI: http://device-service:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      IDENTITY_KAFKA_PUBLISH_ENABLED: "true"
      IDENTITY_DEVICE_LIFECYCLE_SYNC_ENABLED: "false"
      IDENTITY_DEVICE_LIFECYCLE_RECONCILIATION_ENABLED: "true"
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"

  device-service:
    <<: *java-app
    command: sh -c "mvn -pl services/device-service -am -Dmaven.test.skip=true install && mvn -f services/device-service/pom.xml spring-boot:run"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DEVICE_POSTGRES_DB: ${DEVICE_POSTGRES_DB:-voltcanary_device}
      POSTGRES_USER: ${POSTGRES_USER:-voltcanary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      DEVICE_KAFKA_PUBLISH_ENABLED: "true"
      DEVICE_KAFKA_CONSUME_ENABLED: "true"
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-voltcanary_telemetry}
      TIMESCALE_USER: ${TIMESCALE_USER:-voltcanary}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-voltcanary}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change_me_change_me}
    ports:
      - "${DEVICE_SERVICE_PORT:-8082}:8082"

  ingestion-service:
    <<: *java-app
    command: sh -c "mvn -pl services/ingestion-service -am -Dmaven.test.skip=true install && mvn -f services/ingestion-service/pom.xml spring-boot:run"
    ports:
      - "${INGESTION_SERVICE_PORT:-8083}:8083"

  telemetry-service:
    <<: *java-app
    command: sh -c "mvn -pl services/telemetry-service -am -Dmaven.test.skip=true install && mvn -f services/telemetry-service/pom.xml spring-boot:run"
    ports:
      - "${TELEMETRY_SERVICE_PORT:-8084}:8084"

  analytics-service:
    <<: *java-app
    command: sh -c "mvn -pl services/analytics-service -am -Dmaven.test.skip=true install && mvn -f services/analytics-service/pom.xml spring-boot:run"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ANALYTICS_POSTGRES_DB: ${ANALYTICS_POSTGRES_DB:-voltcanary_analytics}
      APP_KAFKA_CONSUME_ENABLED: ${ANALYTICS_KAFKA_CONSUME_ENABLED:-true}
      ANALYTICS_KAFKA_PUBLISH_ENABLED: ${ANALYTICS_KAFKA_PUBLISH_ENABLED:-true}
      ANALYTICS_JOBS_WORKER_ENABLED: "true"
      POSTGRES_USER: ${POSTGRES_USER:-voltcanary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      TELEMETRY_SERVICE_URI: http://telemetry-service:8084
      DEVICE_SERVICE_URI: http://device-service:8082
      ML_SERVICE_URI: http://ml-service:8090
      ALERT_SERVICE_URI: http://alert-service:8086
    ports:
      - "${ANALYTICS_SERVICE_PORT:-8085}:8085"

  alert-service:
    <<: *java-app
    command: sh -c "mvn -pl services/alert-service -am -Dmaven.test.skip=true install && mvn -f services/alert-service/pom.xml spring-boot:run"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ALERT_POSTGRES_DB: ${ALERT_POSTGRES_DB:-voltcanary_alerts}
      POSTGRES_USER: ${POSTGRES_USER:-voltcanary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      DEVICE_SERVICE_URI: http://device-service:8082
      ANALYTICS_SERVICE_URI: http://analytics-service:8085
    ports:
      - "${ALERT_SERVICE_PORT:-8086}:8086"

  simulator-service:
    <<: *java-app
    command: sh -c "mvn -pl services/simulator-service -am -Dmaven.test.skip=true install && mvn -f services/simulator-service/pom.xml spring-boot:run"
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SIMULATOR_POSTGRES_DB: ${SIMULATOR_POSTGRES_DB:-voltcanary_simulator}
      POSTGRES_USER: ${POSTGRES_USER:-voltcanary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      SIMULATOR_INGESTION_URL: http://ingestion-service:8083/ingestion/readings
      SIMULATOR_MQTT_ENABLED: ${SIMULATOR_MQTT_ENABLED:-false}
      SIMULATOR_MQTT_BROKER_URL: tcp://mosquitto:1883
    ports:
      - "${SIMULATOR_SERVICE_PORT:-8087}:8087"

  ai-agent-service:
    <<: *java-app
    command: sh -c "mvn -pl services/ai-agent-service -am -Dmaven.test.skip=true install && mvn -f services/ai-agent-service/pom.xml spring-boot:run"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JWT_SECRET: ${JWT_SECRET:-change_me}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-voltcanary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      DEVICE_SERVICE_URI: http://device-service:8082
      ALERT_SERVICE_URI: http://alert-service:8086
      SIMULATOR_SERVICE_URI: http://simulator-service:8087
      AI_PROVIDER: ${AI_PROVIDER:-rules}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-30000}
      AI_AGENT_POSTGRES_DB: ${AI_AGENT_POSTGRES_DB:-voltcanary_ai_agent}
      AI_AGENT_SECRET_ENCRYPTION_KEY: ${AI_AGENT_SECRET_ENCRYPTION_KEY:-change_me_32_bytes_minimum_local_dev_key}
      AI_AGENT_SECRET_KEY_VERSION: ${AI_AGENT_SECRET_KEY_VERSION:-v1}
    ports:
      - "${AI_AGENT_SERVICE_PORT:-8088}:8088"

  ml-service:
    image: python:3.12-slim
    profiles:
      - app
    working_dir: /workspace/ml-service
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8090"
    ports:
      - "${ML_SERVICE_PORT:-8090}:8090"
    volumes:
      - ./ml-service:/workspace/ml-service

  frontend:
    image: node:22-alpine
    profiles:
      - app
    working_dir: /workspace/frontend
    command: sh -c "test -d node_modules/.vite || npm ci; npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-node-modules:/workspace/frontend/node_modules
    depends_on:
      api-gateway:
        condition: service_started

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    profiles:
      - homeassistant
    environment:
      TZ: ${TZ:-Europe/Budapest}
    ports:
      - "${HOME_ASSISTANT_PORT:-8123}:8123"
    volumes:
      - homeassistant-config:/config
    restart: unless-stopped

volumes:
  postgres-data:
  timescale-data:
  redis-data:
  redpanda-data:
  minio-data:
  prometheus-data:
  loki-data:
  promtail-positions:
  grafana-data:
  maven-cache:
  frontend-node-modules:
  homeassistant-config:
