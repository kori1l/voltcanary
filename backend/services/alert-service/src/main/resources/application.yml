spring:
  application:
    name: alert-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: alert-service
      auto-offset-reset: earliest

app:
  kafka:
    consume-enabled: false

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: alert-service
    description: VoltCanary Alert Service
    version: 0.1.0
