spring:
  application:
    name: alert-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: alert-service
      auto-offset-reset: earliest
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        retry.backoff.ms: 100

app:
  kafka:
    consume-enabled: ${ALERT_KAFKA_CONSUME_ENABLED:false}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
    service-name: ${INTERNAL_SERVICE_NAME:alert-service}
  alert:
    authorization:
      enabled: ${ALERT_AUTHORIZATION_ENABLED:true}
      device-service-base-url: ${DEVICE_SERVICE_URI:http://localhost:8082}
      timeout: ${ALERT_AUTHORIZATION_TIMEOUT:2s}
    kafka:
      retry:
        max-attempts: ${ALERT_KAFKA_RETRY_MAX_ATTEMPTS:3}
        interval: ${ALERT_KAFKA_RETRY_INTERVAL:1s}
      dlq:
        anomaly-topic: ${ALERT_KAFKA_ANOMALY_DLQ_TOPIC:anomaly.detected.dlq.v1}
        risk-score-topic: ${ALERT_KAFKA_RISK_SCORE_DLQ_TOPIC:risk-score.changed.dlq.v1}
        maintenance-window-topic: ${ALERT_KAFKA_MAINTENANCE_WINDOW_DLQ_TOPIC:maintenance-window.changed.dlq.v1}
    notifications:
      enabled: ${ALERT_NOTIFICATIONS_ENABLED:true}
      worker-enabled: ${ALERT_NOTIFICATIONS_WORKER_ENABLED:true}
      max-attempts: ${ALERT_NOTIFICATIONS_MAX_ATTEMPTS:3}
      retry-interval: ${ALERT_NOTIFICATIONS_RETRY_INTERVAL:1s}
      lease-duration: ${ALERT_NOTIFICATIONS_LEASE_DURATION:30s}
      claim-batch-size: ${ALERT_NOTIFICATIONS_CLAIM_BATCH_SIZE:25}
      connect-timeout-millis: ${ALERT_NOTIFICATIONS_CONNECT_TIMEOUT_MS:2000}
      read-timeout-millis: ${ALERT_NOTIFICATIONS_READ_TIMEOUT_MS:5000}
      email:
        from-address: ${ALERT_NOTIFICATIONS_EMAIL_FROM_ADDRESS:}
      telegram:
        api-base-url: ${ALERT_NOTIFICATIONS_TELEGRAM_API_BASE_URL:https://api.telegram.org}
        bot-token: ${ALERT_NOTIFICATIONS_TELEGRAM_BOT_TOKEN:}
    reconciliation:
      enabled: ${ALERT_RECONCILIATION_ENABLED:true}
      interval: ${ALERT_RECONCILIATION_INTERVAL:30s}
      lock-lease: ${ALERT_RECONCILIATION_LOCK_LEASE:20s}
      processing-timeout: ${ALERT_RECONCILIATION_PROCESSING_TIMEOUT:5m}
      retry-delay: ${ALERT_RECONCILIATION_RETRY_DELAY:30s}
      batch-size: ${ALERT_RECONCILIATION_BATCH_SIZE:25}
    escalation:
      enabled: ${ALERT_ESCALATION_ENABLED:true}
      initial-delay-ms: ${ALERT_ESCALATION_INITIAL_DELAY_MS:60000}
      scan-interval-ms: ${ALERT_ESCALATION_SCAN_INTERVAL_MS:60000}
      warning-after: ${ALERT_ESCALATION_WARNING_AFTER:30m}
      high-after: ${ALERT_ESCALATION_HIGH_AFTER:15m}
      critical-after: ${ALERT_ESCALATION_CRITICAL_AFTER:5m}
    retention:
      enabled: ${ALERT_RETENTION_ENABLED:true}
      initial-delay-ms: ${ALERT_RETENTION_INITIAL_DELAY_MS:300000}
      scan-interval-ms: ${ALERT_RETENTION_SCAN_INTERVAL_MS:3600000}
      resolved-alert-ttl: ${ALERT_RETENTION_RESOLVED_ALERT_TTL:180d}
      event-ttl: ${ALERT_RETENTION_EVENT_TTL:365d}
      notification-attempt-ttl: ${ALERT_RETENTION_NOTIFICATION_ATTEMPT_TTL:90d}
  analytics-service:
    base-url: ${ANALYTICS_SERVICE_URI:http://localhost:8085}
    timeout: ${ALERT_ANALYTICS_TIMEOUT:3s}
  device-service:
    base-url: ${DEVICE_SERVICE_URI:http://localhost:8082}
    timeout: ${ALERT_DEVICE_TIMEOUT:3s}
  maintenance:
    reconciliation:
      enabled: ${ALERT_MAINTENANCE_RECONCILIATION_ENABLED:true}
      interval: ${ALERT_MAINTENANCE_RECONCILIATION_INTERVAL:1m}
      lock-lease: ${ALERT_MAINTENANCE_RECONCILIATION_LOCK_LEASE:30s}
      batch-size: ${ALERT_MAINTENANCE_RECONCILIATION_BATCH_SIZE:100}

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: alert-service
    description: VoltCanary Alert Service
    version: 0.1.0
