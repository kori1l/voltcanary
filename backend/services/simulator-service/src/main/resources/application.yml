spring:
  application:
    name: simulator-service

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  simulator:
    http:
      ingestion-url: ${SIMULATOR_INGESTION_URL:http://localhost:8083/ingestion/readings}
    mqtt:
      enabled: ${SIMULATOR_MQTT_ENABLED:false}
      broker-url: ${SIMULATOR_MQTT_BROKER_URL:tcp://mosquitto:1883}
      topic-template: voltcanary/sources/{sourceId}/telemetry

info:
  app:
    name: simulator-service
    description: VoltCanary Simulator Service
    version: 0.1.0
