spring.http.converters.preferred-json-mapper: jackson2
spring.jackson.deserialization.fail-on-null-for-primitives: false
spring:
  application:
    name: simulator-service

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    key-id: ${JWT_KEY_ID:dev-rsa}
    public-keys: ${JWT_PUBLIC_KEYS:}
    issuer: ${JWT_ISSUER:voltcanary-identity}
    audience: ${JWT_AUDIENCE:voltcanary-api}
  simulator:
    target:
      device-service-base-url: ${DEVICE_SERVICE_URL:http://localhost:8082}
      internal-service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
    http:
      ingestion-url: ${SIMULATOR_INGESTION_URL:http://localhost:8083/ingestion/readings}
    mqtt:
      enabled: ${SIMULATOR_MQTT_ENABLED:false}
      broker-url: ${SIMULATOR_MQTT_BROKER_URL:tcp://mosquitto:1883}
      topic-template: voltcanary/sources/{sourceId}/telemetry

info:
  app:
    name: simulator-service
    description: VoltCanary Simulator Service
    version: 0.1.0
