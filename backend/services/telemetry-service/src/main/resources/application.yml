spring:
  application:
    name: telemetry-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: telemetry-service
      auto-offset-reset: earliest
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        retry.backoff.ms: 100

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: telemetry-service
    description: VoltCanary Telemetry Service
    version: 0.1.0

app:
  kafka:
    consume-enabled: true
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
  telemetry:
    authorization:
      enabled: ${TELEMETRY_AUTHORIZATION_ENABLED:true}
      device-service-base-url: ${DEVICE_SERVICE_URI:http://localhost:8082}
      internal-service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
      timeout: ${TELEMETRY_AUTHORIZATION_TIMEOUT:2s}
    validation:
      max-future-skew: ${TELEMETRY_MAX_FUTURE_SKEW:5m}
      max-past-age: ${TELEMETRY_MAX_PAST_AGE:7d}
      max-metrics-per-event: ${TELEMETRY_MAX_METRICS_PER_EVENT:100}
      max-events-per-device-per-minute: ${TELEMETRY_MAX_EVENTS_PER_DEVICE_PER_MINUTE:600}
      redis-rate-limit-enabled: ${TELEMETRY_RATE_LIMIT_REDIS_ENABLED:true}
      max-chart-range: ${TELEMETRY_MAX_CHART_RANGE:30d}
      max-export-page-size: ${TELEMETRY_MAX_EXPORT_PAGE_SIZE:1000}
      backfill-source-prefixes: ${TELEMETRY_BACKFILL_SOURCE_PREFIXES:import-,backfill-}
    timescale:
      policy-enabled: ${TELEMETRY_TIMESCALE_POLICY_ENABLED:false}
