spring:
  application:
    name: telemetry-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: telemetry-service
      auto-offset-reset: earliest

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: telemetry-service
    description: VoltCanary Telemetry Service
    version: 0.1.0

app:
  kafka:
    consume-enabled: false
