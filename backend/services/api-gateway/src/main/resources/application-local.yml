server:
  port: 8080

spring:
  config:
    activate:
      on-profile: local
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins:
                  - "http://localhost:3000"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                exposed-headers:
                  - X-Correlation-Id
                allow-credentials: true
          routes:
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

            - id: device-service
              uri: http://localhost:8082
              predicates:
                - Path=/devices/**,/locations/**,/device-types/**

            - id: ingestion-service
              uri: http://localhost:8083
              predicates:
                - Path=/ingestion/**

            - id: telemetry-service
              uri: http://localhost:8084
              predicates:
                - Path=/telemetry/**

            - id: analytics-service
              uri: http://localhost:8085
              predicates:
                - Path=/analytics/**

            - id: alert-service
              uri: http://localhost:8086
              predicates:
                - Path=/alerts/**

logging:
  level:
    com.voltcanary.gateway: INFO
    org.springframework.cloud.gateway: INFO
