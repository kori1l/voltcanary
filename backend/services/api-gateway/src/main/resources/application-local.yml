server:
  port: 8080

spring:
  config:
    activate:
      on-profile: local
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins:
                  - "http://localhost:3000"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                exposed-headers:
                  - X-Correlation-Id
                allow-credentials: true
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/auth/**

            - id: device-service
              uri: ${DEVICE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/devices/**,/locations/**,/device-types/**

            - id: ingestion-service
              uri: ${INGESTION_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/ingestion/**

            - id: telemetry-service
              uri: ${TELEMETRY_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/telemetry/**

            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/analytics/**

            - id: alert-service
              uri: ${ALERT_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/alerts/**

logging:
  level:
    com.voltcanary.gateway: INFO
    org.springframework.cloud.gateway: INFO
IDENTITY_SERVICE_URI: http://identity-service:8081
DEVICE_SERVICE_URI: http://device-service:8082
INGESTION_SERVICE_URI: http://ingestion-service:8083
TELEMETRY_SERVICE_URI: http://telemetry-service:8084
ANALYTICS_SERVICE_URI: http://analytics-service:8085
ALERT_SERVICE_URI: http://alert-service:8086
