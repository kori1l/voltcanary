spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowed-methods:
                  - GET
                  - POST
                  - PATCH
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - X-Correlation-Id
                exposed-headers:
                  - X-Correlation-Id
                allow-credentials: true
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: device-service-locations
              uri: ${DEVICE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/locations/**
            - id: device-service-accounts
              uri: ${DEVICE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/accounts/**
            - id: device-service-devices
              uri: ${DEVICE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/devices/**
            - id: device-service-types
              uri: ${DEVICE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/device-types/**
            - id: ingestion-service
              uri: ${INGESTION_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/ingestion/**
            - id: telemetry-service
              uri: ${TELEMETRY_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/telemetry/**
            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/analytics/**
            - id: alert-service
              uri: ${ALERT_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/alerts/**
            - id: alert-rules-service
              uri: ${ALERT_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/alert-rules/**
            - id: simulator-service
              uri: ${SIMULATOR_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/simulation/**

            - id: ai-agent-service
              uri: ${AI_AGENT_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/ai-agent/**

app:
  jwt:
    key-id: ${JWT_KEY_ID:dev-rsa}
    public-keys: ${JWT_PUBLIC_KEYS:}
    issuer: ${JWT_ISSUER:voltcanary-identity}
    audience: ${JWT_AUDIENCE:voltcanary-api}
  gateway:
    rate-limit:
      enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
      redis-enabled: ${GATEWAY_RATE_LIMIT_REDIS_ENABLED:true}
      window: ${GATEWAY_RATE_LIMIT_WINDOW:1m}
      auth-requests-per-window: ${GATEWAY_AUTH_RATE_LIMIT:30}
      ingestion-requests-per-window: ${GATEWAY_INGESTION_RATE_LIMIT:120}
      general-requests-per-window: ${GATEWAY_GENERAL_RATE_LIMIT:600}
    request-size:
      default-max-bytes: ${GATEWAY_REQUEST_MAX_BYTES:1048576}
      auth-max-bytes: ${GATEWAY_AUTH_REQUEST_MAX_BYTES:65536}
      ingestion-max-bytes: ${GATEWAY_INGESTION_REQUEST_MAX_BYTES:262144}
    cors:
      allowed-origin-patterns:
        - ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allowed-methods:
        - GET
        - POST
        - PATCH
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Correlation-Id
      exposed-headers:
        - X-Correlation-Id
      allow-credentials: true
    downstream-health:
      enabled: ${GATEWAY_DOWNSTREAM_HEALTH_ENABLED:false}
      timeout: ${GATEWAY_DOWNSTREAM_HEALTH_TIMEOUT:2s}
      services:
        identity-service: ${IDENTITY_SERVICE_URI:http://localhost:8081}
        device-service: ${DEVICE_SERVICE_URI:http://localhost:8082}
        ingestion-service: ${INGESTION_SERVICE_URI:http://localhost:8083}
        telemetry-service: ${TELEMETRY_SERVICE_URI:http://localhost:8084}
        analytics-service: ${ANALYTICS_SERVICE_URI:http://localhost:8085}
        alert-service: ${ALERT_SERVICE_URI:http://localhost:8086}
        simulator-service: ${SIMULATOR_SERVICE_URI:http://localhost:8087}
        ai-agent-service: ${AI_AGENT_SERVICE_URI:http://localhost:8088}

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: api-gateway
    description: VoltCanary API Gateway
    version: 0.1.0
