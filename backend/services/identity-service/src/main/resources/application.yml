spring.http.converters.preferred-json-mapper: jackson2
spring.jackson.deserialization.fail-on-null-for-primitives: false
spring:
  application:
    name: identity-service
  kafka:
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        retry.backoff.ms: 100

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: identity-service
    description: VoltCanary Identity Service
    version: 0.1.0

app:
  jwt:
    key-id: ${JWT_KEY_ID:dev-rsa}
    private-key: ${JWT_PRIVATE_KEY:}
    public-keys: ${JWT_PUBLIC_KEYS:}
    issuer: ${JWT_ISSUER:voltcanary-identity}
    audience: ${JWT_AUDIENCE:voltcanary-api}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}
  kafka:
    publish-enabled: ${IDENTITY_KAFKA_PUBLISH_ENABLED:false}
  identity:
    downstream:
      device-service-base-url: ${DEVICE_SERVICE_URI:http://localhost:8082}
      internal-service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
      device-lifecycle-sync-enabled: ${IDENTITY_DEVICE_LIFECYCLE_SYNC_ENABLED:false}
      device-lifecycle-reconciliation-enabled: ${IDENTITY_DEVICE_LIFECYCLE_RECONCILIATION_ENABLED:false}
      device-lifecycle-reconciliation-batch-size: ${IDENTITY_DEVICE_LIFECYCLE_RECONCILIATION_BATCH_SIZE:100}
    lifecycle-reconciliation:
      delay: ${IDENTITY_DEVICE_LIFECYCLE_RECONCILIATION_DELAY:5m}
