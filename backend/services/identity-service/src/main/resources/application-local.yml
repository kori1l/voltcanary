spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${IDENTITY_POSTGRES_DB:voltcanary_identity}
    username: ${POSTGRES_USER:voltcanary}
    password: ${POSTGRES_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  auth:
    browser:
      secure-cookie: ${BROWSER_SESSION_SECURE_COOKIE:false}
      allowed-origins: ${BROWSER_SESSION_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:8443}
