spring:
  application:
    name: ingestion-service
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ingestion-service
    description: VoltCanary Ingestion Service
    version: 0.1.0

app:
  kafka:
    publish-enabled: true
  idempotency:
    redis-enabled: false
    ttl: PT24H
  device-service:
    base-url: ${DEVICE_SERVICE_URI:http://localhost:8082}
