spring:
  application:
    name: device-service

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: device-service
    description: VoltCanary Device Service
    version: 0.1.0

app:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
  kafka:
    publish-enabled: ${DEVICE_KAFKA_PUBLISH_ENABLED:true}
