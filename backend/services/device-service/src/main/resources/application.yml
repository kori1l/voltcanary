spring.http.converters.preferred-json-mapper: jackson2
spring.jackson.deserialization.fail-on-null-for-primitives: false
spring:
  application:
    name: device-service
  kafka:
    consumer:
      group-id: ${DEVICE_KAFKA_CONSUMER_GROUP:device-service}
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        retry.backoff.ms: 100

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: device-service
    description: VoltCanary Device Service
    version: 0.1.0

app:
  source-capture:
    telemetry-service-base-url: ${TELEMETRY_SERVICE_URI:http://localhost:8084}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
    timeout: ${SOURCE_CAPTURE_OWNER_TIMEOUT:2s}
  native-data:
    cursor-key: ${NATIVE_DATA_CURSOR_KEY:}
  jwt:
    key-id: ${JWT_KEY_ID:dev-rsa}
    public-keys: ${JWT_PUBLIC_KEYS:}
    issuer: ${JWT_ISSUER:voltcanary-identity}
    audience: ${JWT_AUDIENCE:voltcanary-api}
  variables:
    activation-enabled: ${VARIABLE_ACTIVATION_ENABLED:false}
  workspace-identity:
    base-url: ${IDENTITY_SERVICE_URI:http://localhost:8081}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
  kafka:
    publish-enabled: ${DEVICE_KAFKA_PUBLISH_ENABLED:false}
    consume-enabled: ${DEVICE_KAFKA_CONSUME_ENABLED:false}
