spring:
  application:
    name: analytics-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest

app:
  kafka:
    consume-enabled: false
    publish-enabled: ${ANALYTICS_KAFKA_PUBLISH_ENABLED:true}
  telemetry-service:
    base-url: ${TELEMETRY_SERVICE_URI:http://localhost:8084}
  ml-service:
    base-url: ${ML_SERVICE_URI:http://localhost:8090}

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: analytics-service
    description: VoltCanary Analytics Service
    version: 0.1.0
