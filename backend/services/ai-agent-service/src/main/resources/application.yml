spring:
  application:
    name: ai-agent-service

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  ai:
    provider: ${AI_PROVIDER:rules}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.4-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      timeout-ms: ${OPENAI_TIMEOUT_MS:30000}
  jwt:
    secret: ${JWT_SECRET:change_me}
  services:
    device-base-url: ${DEVICE_SERVICE_URI:http://localhost:8082}
    simulator-base-url: ${SIMULATOR_SERVICE_URI:http://localhost:8087}

info:
  app:
    name: ai-agent-service
    description: VoltCanary AI Agent Service
    version: 0.1.0
