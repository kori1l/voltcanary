spring.http.converters.preferred-json-mapper: jackson2
spring.jackson.deserialization.fail-on-null-for-primitives: false
spring:
  application:
    name: ai-agent-service

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  ai:
    widget-embeddings:
      enabled: ${AI_WIDGET_EMBEDDINGS_ENABLED:false}
      base-url: ${AI_WIDGET_EMBEDDINGS_BASE_URL:http://localhost:11434/v1}
      model: ${AI_WIDGET_EMBEDDINGS_MODEL:}
      api-key: ${AI_WIDGET_EMBEDDINGS_API_KEY:}
      timeout-ms: ${AI_WIDGET_EMBEDDINGS_TIMEOUT_MS:3000}
    orchestration:
      enabled: ${AI_ASSISTANT_V2_ENABLED:false}
      native-data-enabled: false
    device-setup-enabled: ${AI_DEVICE_SETUP_ENABLED:false}
    dashboard-operations-enabled: ${AI_DASHBOARD_OPERATIONS_ENABLED:false}
    provider: ${AI_PROVIDER:rules}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.4-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      timeout-ms: ${OPENAI_TIMEOUT_MS:30000}
    secrets:
      encryption-key: ${AI_AGENT_SECRET_ENCRYPTION_KEY:}
      key-version: ${AI_AGENT_SECRET_KEY_VERSION:v1}
    services:
      hsl-connector-base-url: ${HSL_CONNECTOR_SERVICE_URI:http://hsl-connector:8091}
      device-base-url: ${DEVICE_SERVICE_URI:http://localhost:8082}
      alert-base-url: ${ALERT_SERVICE_URI:http://localhost:8084}
      simulator-base-url: ${SIMULATOR_SERVICE_URI:http://localhost:8087}
      dashboard-base-url: ${DASHBOARD_SERVICE_URI:http://localhost:8089}
      telemetry-base-url: ${TELEMETRY_SERVICE_URI:http://localhost:8084}
  jwt:
    key-id: ${JWT_KEY_ID:dev-rsa}
    public-keys: ${JWT_PUBLIC_KEYS:}
    issuer: ${JWT_ISSUER:voltcanary-identity}
    audience: ${JWT_AUDIENCE:voltcanary-api}

info:
  app:
    name: ai-agent-service
    description: VoltCanary AI Agent Service
    version: 0.1.0
