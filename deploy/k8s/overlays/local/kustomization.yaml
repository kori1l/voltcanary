      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: backend-workspace
          hostPath:
            path: /run/desktop/mnt/host/d/canary/voltcanary/backend
            type: Directory
  - target:
      kind: Deployment
      name: ingestion-service
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: backend-workspace
          hostPath:
            path: /run/desktop/mnt/host/d/canary/voltcanary/backend
            type: Directory
  - target:
      kind: Deployment
      name: telemetry-service
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: backend-workspace
