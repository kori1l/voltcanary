apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ha.yaml
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchExpressions:
                - key: app
                  operator: Exists
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 1Gi
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: backend-workspace
          hostPath:
            path: /run/desktop/mnt/host/d/canary/voltcanary/backend
            type: Directory
  - target:
      kind: Deployment
      name: identity-service
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: backend-workspace
          hostPath:
            path: /run/desktop/mnt/host/d/canary/voltcanary/backend
            type: Directory
  - target:
      kind: Deployment
      name: device-service
