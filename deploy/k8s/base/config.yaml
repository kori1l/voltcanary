apiVersion: v1
kind: ConfigMap
metadata:
  name: voltcanary-config
  namespace: voltcanary
data:
  SPRING_PROFILES_ACTIVE: local
  SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: voltcanary
  IDENTITY_POSTGRES_DB: voltcanary_identity
  DEVICE_POSTGRES_DB: voltcanary_device
  ANALYTICS_POSTGRES_DB: voltcanary_analytics
  ALERT_POSTGRES_DB: voltcanary_alerts
  SIMULATOR_POSTGRES_DB: voltcanary_simulator
  TIMESCALE_HOST: timescaledb
  TIMESCALE_PORT: "5432"
  TIMESCALE_DB: voltcanary_telemetry
  TIMESCALE_USER: voltcanary
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  INGESTION_IDEMPOTENCY_REDIS_ENABLED: "true"
  INGESTION_RATE_LIMIT_REDIS_ENABLED: "true"
  TELEMETRY_RATE_LIMIT_REDIS_ENABLED: "true"
  GATEWAY_RATE_LIMIT_REDIS_ENABLED: "true"
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: voltcanary
  IDENTITY_SERVICE_URI: http://identity-service:8081
  DEVICE_SERVICE_URI: http://device-service:8082
  IDENTITY_KAFKA_PUBLISH_ENABLED: "true"
  IDENTITY_DEVICE_LIFECYCLE_SYNC_ENABLED: "false"
  IDENTITY_DEVICE_LIFECYCLE_RECONCILIATION_ENABLED: "true"
  DEVICE_KAFKA_PUBLISH_ENABLED: "true"
  DEVICE_KAFKA_CONSUME_ENABLED: "true"
  INGESTION_SERVICE_URI: http://ingestion-service:8083
  TELEMETRY_SERVICE_URI: http://telemetry-service:8084
  ANALYTICS_SERVICE_URI: http://analytics-service:8085
  ANALYTICS_JOBS_WORKER_ENABLED: "true"
  APP_ML_TRAINING_WORKER_ENABLED: "true"
  APP_ML_TRAINING_WORKER_DELAY: "5000"
  ML_ARTIFACT_STORE: s3
  ML_ARTIFACT_BUCKET: model-artifacts
  AWS_REGION: us-east-1
  S3_FORCE_PATH_STYLE: "true"
  AWS_EC2_METADATA_DISABLED: "true"
  ALERT_SERVICE_URI: http://alert-service:8086
  SIMULATOR_SERVICE_URI: http://simulator-service:8087
  SIMULATOR_INGESTION_URL: http://ingestion-service:8083/ingestion/readings
  SIMULATOR_MQTT_ENABLED: "false"
  SIMULATOR_MQTT_BROKER_URL: tcp://mosquitto:1883
  INGESTION_MQTT_ENABLED: "false"
  INGESTION_MQTT_BROKER_URL: tcp://mosquitto:1883
  ML_SERVICE_URI: http://ml-service:8090
  VITE_API_BASE_URL: http://localhost:8080
---
apiVersion: v1
kind: Secret
metadata:
  name: voltcanary-secrets
  namespace: voltcanary
type: Opaque
stringData:
  POSTGRES_USER: voltcanary
  POSTGRES_PASSWORD: change_me
  TIMESCALE_PASSWORD: change_me
  JWT_SECRET: change_me
  MINIO_ROOT_USER: voltcanary
  MINIO_ROOT_PASSWORD: change_me_change_me
  MINIO_SECRET_KEY: change_me_change_me
