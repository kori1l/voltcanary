apiVersion: batch/v1
kind: Job
metadata:
  name: dashboard-database-init-v1
  namespace: voltcanary
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-dashboard-database
          image: postgres:16-alpine
          envFrom:
            - configMapRef:
                name: voltcanary-config
            - secretRef:
                name: voltcanary-secrets
          env:
            - name: PGHOST
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: voltcanary-secrets
                  key: POSTGRES_PASSWORD
          command: ["/bin/sh", "-ec"]
          args:
            - |
              psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
              SELECT 'CREATE DATABASE voltcanary_dashboard'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='voltcanary_dashboard')
              \gexec
              SQL
