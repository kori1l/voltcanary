services:
  hsl-connector:
    build: ./deploy/connectors/hsl
    profiles: [hsl]
    restart: unless-stopped
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      HSL_SETUP_ENABLED: ${AI_DEVICE_SETUP_ENABLED:-false}
      HSL_CONFIG_PATH: /run/hsl/config.json
      HSL_INGESTION_URL: http://ingestion-service:8083/ingestion/readings
    volumes:
      - ./docker-data/hsl:/run/hsl
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, health.py]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
