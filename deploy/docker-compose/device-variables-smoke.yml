name: voltcanary-variable-smoke
x-java: &java
  image: maven:3.9-eclipse-temurin-21
  profiles: [applications]
  working_dir: /workspace/backend
  volumes:
    - ../../backend:/workspace/backend:ro
  environment:
    IDENTITY_SERVICE_URI: http://identity-service:18081
    DEVICE_SERVICE_URI: http://device-service:18082
    INGESTION_SERVICE_URI: http://ingestion-service:18083
    TELEMETRY_SERVICE_URI: http://telemetry-service:18084
    ANALYTICS_SERVICE_URI: http://analytics-service:18085
    ALERT_SERVICE_URI: http://alert-service:18086
    DASHBOARD_SERVICE_URI: http://dashboard-service:18089
    INTERNAL_SERVICE_TOKEN: variable-smoke-internal
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20
  identity-service:
    <<: *java
    ports: ["18081:18081"]
  api-gateway:
    <<: *java
    ports: ["18080:18080"]
  device-service:
    <<: *java
    ports: ["18082:18082"]
  ingestion-service:
    <<: *java
    ports: ["18083:18083"]
  telemetry-service:
    <<: *java
    ports: ["18084:18084"]
  analytics-service:
    <<: *java
    ports: ["18085:18085"]
  alert-service:
    <<: *java
    ports: ["18086:18086"]
  dashboard-service:
    <<: *java
    ports: ["18089:18089"]
  frontend:
    image: nginx:alpine
    profiles: [applications]
    ports: ["13000:80"]
    volumes:
      - ../../frontend/dist:/usr/share/nginx/html:ro
      - ./device-variables-nginx.conf:/etc/nginx/conf.d/default.conf:ro
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: variable
      POSTGRES_PASSWORD: variable-local-test
      POSTGRES_DB: device
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U variable -d device"]
      interval: 2s
      retries: 30
  timescale:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: variable
      POSTGRES_PASSWORD: variable-local-test
      POSTGRES_DB: telemetry
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U variable -d telemetry"]
      interval: 2s
      retries: 30
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - external://0.0.0.0:9092,internal://0.0.0.0:9093
      - --advertise-kafka-addr
      - external://localhost:18092,internal://redpanda:9093
    ports:
      - "18092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "-X", "brokers=localhost:9093"]
      interval: 3s
      retries: 30
