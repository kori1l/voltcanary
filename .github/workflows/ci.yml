name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: Change Filters
    runs-on: ubuntu-latest
    outputs:
      ml-production-smoke: ${{ steps.filter.outputs['ml-production-smoke'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect ML smoke paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ml-production-smoke:
              - 'ml-service/**'
              - 'backend/services/analytics-service/src/main/java/com/voltcanary/analytics/ml/**'
              - 'backend/services/analytics-service/src/main/java/com/voltcanary/analytics/service/Ml*/**'
              - 'backend/services/analytics-service/src/main/java/com/voltcanary/analytics/service/*Ml*.java'
              - 'backend/services/analytics-service/src/main/java/com/voltcanary/analytics/service/AnalyticsRecalculationService.java'
              - 'backend/services/analytics-service/src/main/resources/db/migration/**'
              - 'deploy/docker-compose/**'
              - 'docker-compose.yml'
              - 'scripts/ml-failure-prediction-docker-smoke.ps1'
              - 'scripts/ml-anomaly-detection-docker-smoke.ps1'
              - 'scripts/ml-alert-incident-docker-smoke.ps1'
              - 'scripts/ml-full-docker-verification.ps1'
              - 'scripts/ml-verification-fixtures.ps1'
              - 'docs/api/ml-api.md'
              - 'docs/flows/ml-failure-prediction-docker-verification.md'
              - 'docs/flows/ml-full-verification.md'
              - 'docs/flows/ml-full-verification-summary.schema.json'
              - 'docs/flows/ml-full-verification-report-template.md'
              - 'docs/operations/ml-operations.md'
              - 'openspec/changes/**/specs/ml-*.md'
              - 'openspec/specs/ml-*.md'

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root tooling
        run: npm ci

      - name: Validate OpenSpec
        run: npm run openspec:validate

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: mvn test

  ml-service:
    name: ML Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements.txt

      - name: Run ML tests
        working-directory: ml-service
        run: python -m unittest discover -s app/tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  ml-production-smoke:
    name: ML Production Smoke
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs['ml-production-smoke'] == 'true' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Docker full ML verification
        shell: pwsh
        run: |
          ./scripts/ml-full-docker-verification.ps1 `
            -StartStack `
            -CiMode `
            -TimeoutSeconds 1200 `
            -SummaryPath artifacts/ml-full-verification-summary.json

      - name: Upload ML verification summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-verification-summaries
          path: |
            artifacts/ml-production-smoke-summary.json
            artifacts/ml-anomaly-smoke-summary.json
            artifacts/ml-alert-incident-smoke-summary.json
            artifacts/ml-full-verification-summary.json
          if-no-files-found: ignore
